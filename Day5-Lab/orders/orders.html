<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    
    <title>Order Analytics Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
      }

       body {
        margin: 0;
        color: #222338;
        background: #f5f7fa;
        font-family:
          Arial,
          Helvetica,
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .container {
        width: min(1150px, calc(100% - 32px));
        margin: auto;
      }

      header {
        padding: 55px 0;
        color: white;
        background: linear-gradient(
          135deg,
          #17182d,
          #24355e,
          #176747
        );
      }

      header h1 {
        margin: 0 0 12px;
        font-size: 42px;
      }

      header p {
        max-width: 650px;
        margin: 0;
        color: #d9dbea;
        line-height: 1.6;
      }
