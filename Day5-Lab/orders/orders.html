<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    
    <title>Order Analytics Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
      }

       body {
        margin: 0;
        color: #222338;
        background: #f5f7fa;
        font-family:
          Arial,
          Helvetica,
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .container {
        width: min(1150px, calc(100% - 32px));
        margin: auto;
      }

      header {
        padding: 55px 0;
        color: white;
        background: linear-gradient(
          135deg,
          #17182d,
          #24355e,
          #176747
        );
      }

      header h1 {
        margin: 0 0 12px;
        font-size: 42px;
      }

      header p {
        max-width: 650px;
        margin: 0;
        color: #d9dbea;
        line-height: 1.6;
      }

       main {
        padding: 30px 0 60px;
      }

      .panel {
        margin-bottom: 25px;
        padding: 22px;
        border: 1px solid #dde1e8;
        border-radius: 14px;
        background: white;
        box-shadow: 0 10px 25px rgba(20, 25, 40, 0.08);
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 20px;
      }

      .label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: bold;
        text-transform: uppercase;
      }

      .status-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .status-button {
        padding: 9px 15px;
        border: 1px solid #d5d9e1;
        border-radius: 50px;
        color: #222338;
        background: white;
        cursor: pointer;
      }

      .status-button.active {
        border-color: #167c52;
        color: white;
        background: #167c52;
      }

       .search-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccd1da;
        border-radius: 8px;
      }

      .discount-area {
        display: flex;
        gap: 15px;
        align-items: center;
        justify-content: space-between;
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid #dde1e8;
      }

      .discount-area label {
        font-weight: bold;
        cursor: pointer;
      }

       .discount-area input {
        width: 18px;
        height: 18px;
        margin-right: 8px;
        accent-color: #ed4b1f;
      }

      #preview-message {
        margin: 0;
        color: #666979;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 25px;
      }

      .summary-card {
        padding: 20px;
        border: 1px solid #dde1e8;
        border-top: 4px solid #167c52;
        border-radius: 12px;
        background: white;
        box-shadow: 0 10px 25px rgba(20, 25, 40, 0.07);
      }

      .summary-card:nth-child(2) {
        border-top-color: #2474b8;
      }

      .summary-card:nth-child(3) {
        border-top-color: #c08a00;
      }

      .summary-card:nth-child(4) {
        border-top-color: #ed4b1f;
      }

       .summary-card h3 {
        margin: 0 0 10px;
        color: #686b79;
        font-size: 13px;
        text-transform: uppercase;
      }

      .summary-value {
        margin: 0;
        font-size: 25px;
        font-weight: bold;
      }

      .summary-description {
        margin: 7px 0 0;
        color: #686b79;
        font-size: 13px;
      }

      .insights {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .insights h2,
      .orders-heading h2 {
        margin-top: 0;
      }

      .top-order {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        padding: 12px;
        border-radius: 8px;
        background: #f5f7fa;
      }

      .customer-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0;
        list-style: none;
      }

      .customer-list li {
        padding: 8px 11px;
        border-radius: 30px;
        color: #126744;
        background: #e9f7f0;
        font-weight: bold;
      }
