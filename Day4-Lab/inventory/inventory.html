<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Coffee Shop Inventory</title>

   <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --coffee-dark: #3d2925;
      --coffee-medium: #7a5138;
      --coffee-light: #f5eee8;
    }

     body {
      background-color: var(--coffee-light);
    }

    .coffee-navbar {
      background-color: var(--coffee-dark);
    }

    .coffee-heading,
    .summary-value {
      color: var(--coffee-medium);
    }

    .product-card {
      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);

      box-shadow:
        0 0.75rem 1.5rem
        rgba(61, 41, 37, 0.12) !important;
    }

    .category-icon {
      font-size: 2rem;
      line-height: 1;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-dark coffee-navbar">
    <div class="container">
      <span class="navbar-brand">
        Bean &amp; Brew Inventory
      </span>
    </div>
  </nav>

  <main class="container py-4">

    <header class="mb-4">

      <p class="text-uppercase small fw-bold text-muted mb-1">
        Coffee shop dashboard
      </p>

      <h1 class="coffee-heading">
        Coffee Shop Inventory
      </h1>

      <p class="text-muted mb-0">
        Track ingredients, bakery products, and shop supplies
        using local JavaScript data.
      </p>

    </header>

    <!-- Computed summary -->
    <section
      class="row mb-4"
      aria-label="Coffee shop inventory summary"
    >

    <div class="col-12 col-md-6 mb-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">

            <h2 class="h5 card-title">
              Total Inventory Value
            </h2>

            <p
              id="totalInventoryValue"
              class="display-6 summary-value mb-0"
            >
              $0.00
            </p>

          </div>
        </div>
      </div>


      <div class="col-12 col-md-6 mb-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">

            <h2 class="h5 card-title">
              Low-Stock Items
            </h2>

            <p
              id="lowStockCount"
              class="display-6 text-danger mb-0"
            >
              0
            </p>

            <small class="text-muted">
              Items with fewer than 10 units
            </small>

          </div>
        </div>
      </div>

    </section>

    <!-- Inventory cards -->
    <section aria-labelledby="itemsHeading">

      <div
        class="d-flex flex-column flex-sm-row
               justify-content-between align-items-sm-center
               gap-3 mb-3"
      >

      <h2
          id="itemsHeading"
          class="h3 coffee-heading mb-0"
        >
          Inventory Items
        </h2>

        <button
          id="toggleLowStockButton"
          type="button"
          class="btn btn-outline-danger"
        >

        Show Low Stock Only
        </button>

      </div>

      <div id="productList" class="row"></div>

    </section>

  </main>
