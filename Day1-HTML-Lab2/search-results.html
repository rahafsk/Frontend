<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results - Nova Market</title>
</head>

<body>
  <header>
    <p><strong>Nova Market</strong></p>

     <form action="search-results.html" method="get">
      <label for="search">Search products</label>
      <input
        type="search"
        id="search"
        name="q"
        value="wireless headphones"
        required
      >
      <button type="submit">Search</button>
    </form>

     <nav aria-label="Account navigation">
      <a href="#">Account</a>
      <a href="#">Orders</a>
      <a href="#">Cart (0)</a>
    </nav>
  </header>

  <main>
    <nav aria-label="Breadcrumb">
      <a href="#">Home</a> &gt;
      <a href="#">Electronics</a> &gt;
      <span>Wireless Headphones</span>
    </nav>

     <h1>Search Results for “Wireless Headphones”</h1>

    <aside>
      <h2>Filter Results</h2>

      <form action="search-results.html" method="get">
        <fieldset>
          <legend>Brand</legend>

          <input
            type="checkbox"
            id="brand-nova"
            name="brand"
            value="nova"
          >
          <label for="brand-nova">Nova</label><br>

           <input
            type="checkbox"
            id="brand-sonora"
            name="brand"
            value="sonora"
          >
          <label for="brand-sonora">Sonora</label><br>

          <fieldset>
          <legend>Minimum Rating</legend>

          <input
            type="radio"
            id="rating-four"
            name="rating"
            value="4"
          >
          <label for="rating-four">4 stars and above</label><br>

          <input
            type="radio"
            id="rating-three"
            name="rating"
            value="3"
          >
          <label for="rating-three">3 stars and above</label><br>

          <input
            type="radio"
            id="rating-any"
            name="rating"
            value="any"
            checked
          >
          <label for="rating-any">Any rating</label>
        </fieldset>

        <fieldset>
          <legend>Price Range</legend>

          <label for="minimum-price">Minimum price</label>
          <input
            type="number"
            id="minimum-price"
            name="minimumPrice"
            min="0"
            max="500"
            placeholder="0"
          >

          <label for="maximum-price">Maximum price</label>
          <input
            type="number"
            id="maximum-price"
            name="maximumPrice"
            min="0"
            max="500"
            placeholder="500"
          >
        </fieldset>

        <button type="submit">Apply Filters</button>
        <button type="reset">Clear Filters</button>
      </form>
    </aside>

    <section aria-labelledby="results-heading">
      <h2 id="results-heading">Products</h2>

      <p>1–6 of 24 results</p>
