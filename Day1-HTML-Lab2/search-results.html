<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results - Nova Market</title>
</head>

<body>
  <header>
    <p><strong>Nova Market</strong></p>

     <form action="search-results.html" method="get">
      <label for="search">Search products</label>
      <input
        type="search"
        id="search"
        name="q"
        value="wireless headphones"
        required
      >
      <button type="submit">Search</button>
    </form>

     <nav aria-label="Account navigation">
      <a href="#">Account</a>
      <a href="#">Orders</a>
      <a href="#">Cart (0)</a>
    </nav>
  </header>

  <main>
    <nav aria-label="Breadcrumb">
      <a href="#">Home</a> &gt;
      <a href="#">Electronics</a> &gt;
      <span>Wireless Headphones</span>
    </nav>

     <h1>Search Results for “Wireless Headphones”</h1>

    <aside>
      <h2>Filter Results</h2>

      <form action="search-results.html" method="get">
        <fieldset>
          <legend>Brand</legend>

          <input
            type="checkbox"
            id="brand-nova"
            name="brand"
            value="nova"
          >
          <label for="brand-nova">Nova</label><br>

           <input
            type="checkbox"
            id="brand-sonora"
            name="brand"
            value="sonora"
          >
          <label for="brand-sonora">Sonora</label><br>
