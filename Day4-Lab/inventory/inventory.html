<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Product Inventory Utility</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="bg-light">

  <!-- Navigation bar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">
        Product Inventory Utility
      </span>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Page heading -->
    <header class="mb-4">
      <h1 class="h2">Inventory Dashboard</h1>

      <p class="text-muted mb-0">
        All information comes from local JavaScript data.
      </p>
    </header>

     <!-- Inventory summary -->
    <section
      class="row mb-4"
      aria-label="Inventory summary"
    >

    <!-- Total inventory value -->
      <div class="col-12 col-md-6 mb-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">

            <h2 class="h5 card-title">
              Total Inventory Value
            </h2>

            <p
              id="totalInventoryValue"
              class="display-6 text-primary mb-0"
            >
              $0.00
            </p>

          </div>
        </div>
      </div>

      <!-- Low-stock count -->
      <div class="col-12 col-md-6 mb-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">

            <h2 class="h5 card-title">
              Low-Stock Products
            </h2>

            <p
              id="lowStockCount"
              class="display-6 text-warning mb-0"
            >
              0
            </p>

            <small class="text-muted">
              Products with fewer than 10 units
            </small>

          </div>
        </div>
      </div>

      </section>

      <!-- Product section -->
    <section aria-labelledby="productsHeading">

      <div
        class="d-flex flex-column flex-sm-row
               justify-content-between align-items-sm-center
               gap-3 mb-3"
      >

      <h2 id="productsHeading" class="h3 mb-0">
          Products
        </h2>
